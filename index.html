<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <style>
    :root {
      --bg: #111827;
      --panel: #1f2937;
      --button: #374151;
      --button-operator: #f59e0b;
      --button-accent: #10b981;
      --text: #f9fafb;
      --muted: #d1d5db;
      --shadow: rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .calculator {
      width: min(90vw, 360px);
      background: var(--panel);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 40px var(--shadow);
    }

    .display {
      background: #0b1220;
      border-radius: 12px;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 18px 16px;
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 700;
      overflow: hidden;
      word-wrap: break-word;
      word-break: break-all;
      margin-bottom: 18px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 12px;
      height: 62px;
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease;
      color: var(--text);
      background: var(--button);
    }

    button:hover {
      opacity: 0.95;
    }

    button:active {
      transform: scale(0.98);
    }

    .operator {
      background: var(--button-operator);
    }

    .action {
      background: var(--button-accent);
    }

    .zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div id="display" class="display">0</div>

    <div class="buttons">
      <button class="action" data-action="clear">C</button>
      <button class="action" data-action="delete">⌫</button>
      <button class="operator" data-value="/">÷</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="+">+</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="operator" data-action="equals">=</button>

      <button class="zero" data-value="0">0</button>
      <button data-value=".">.</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");
    const buttons = document.querySelectorAll("button");

    let currentValue = "0";
    let previousValue = null;
    let operator = null;
    let waitForNewValue = false;

    function updateDisplay() {
      display.textContent = currentValue;
    }

    function inputDigit(value) {
      if (waitForNewValue) {
        currentValue = value;
        waitForNewValue = false;
      } else {
        currentValue = currentValue === "0" ? value : currentValue + value;
      }
      updateDisplay();
    }

    function inputDecimal() {
      if (waitForNewValue) {
        currentValue = "0.";
        waitForNewValue = false;
        updateDisplay();
        return;
      }

      if (!currentValue.includes(".")) {
        currentValue += ".";
        updateDisplay();
      }
    }

    function clearCalculator() {
      currentValue = "0";
      previousValue = null;
      operator = null;
      waitForNewValue = false;
      updateDisplay();
    }

    function deleteLast() {
      if (waitForNewValue) return;

      currentValue = currentValue.length > 1
        ? currentValue.slice(0, -1)
        : "0";

      updateDisplay();
    }

    function calculate(first, second, op) {
      const a = parseFloat(first);
      const b = parseFloat(second);

      switch (op) {
        case "+": return a + b;
        case "-": return a - b;
        case "*": return a * b;
        case "/":
          if (b === 0) return "Error";
          return a / b;
        default: return second;
      }
    }

    function handleOperator(nextOperator) {
      const inputValue = parseFloat(currentValue);

      if (previousValue === null) {
        previousValue = inputValue;
      } else if (operator) {
        const result = calculate(previousValue, currentValue, operator);

        currentValue = String(result);
        previousValue = result;
      }

      operator = nextOperator;
      waitForNewValue = true;
      updateDisplay();
    }

    function evaluate() {
      if (!operator || previousValue === null) return;

      const result = calculate(previousValue, currentValue, operator);

      currentValue = String(result);
      previousValue = null;
      operator = null;
      waitForNewValue = false;

      updateDisplay();
    }

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        const value = button.dataset.value;
        const action = button.dataset.action;

        if (value !== undefined) {
          if (value === ".") {
            inputDecimal();
          } else {
            inputDigit(value);
          }
          return;
        }

        switch (action) {
          case "clear":
            clearCalculator();
            break;
          case "delete":
            deleteLast();
            break;
          case "equals":
            evaluate();
            break;
          default:
            break;
        }
      });
    });

    document.querySelectorAll(".operator").forEach((button) => {
      button.addEventListener("click", () => {
        const value = button.dataset.value;
        if (value) {
          handleOperator(value);
        }
      });
    });

    document.addEventListener("keydown", (event) => {
      const { key } = event;

      if (/^[0-9]$/.test(key)) {
        inputDigit(key);
      } else if (key === ".") {
        inputDecimal();
      } else if (["+", "-", "*", "/"].includes(key)) {
        handleOperator(key);
      } else if (key === "Enter" || key === "=") {
        evaluate();
      } else if (key === "Backspace") {
        deleteLast();
      } else if (key === "Escape") {
        clearCalculator();
      }
    });
  </script>
</body>
</html>
